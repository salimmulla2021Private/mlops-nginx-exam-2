services:

  mlops-nginx-exam:
    build:
      context: .
      dockerfile: src/api/v1/Dockerfile

    expose:
      - "8000"

    deploy:
      replicas: 3

  mlops-nginx-exam-debug:
    build:
      context: .
      dockerfile: src/api/v2/Dockerfile

    expose:
      - "8007"

    deploy:
      replicas: 3

  nginx:
    build:
      context: .
      dockerfile: deployments/nginx/Dockerfile

    container_name: nginx_revproxy

    ports:
      - "8080:80"
      - "443:443"

    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro

    depends_on:
      - mlops-nginx-exam
      - mlops-nginx-exam-debug

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest

    container_name: nginx_exporter

    ports:
      - "9113:9113"

    depends_on:
      - nginx

    environment:
      SCRAPE_URI: http://nginx_revproxy:8081/nginx_status

  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus_server

    ports:
      - "9090:9090"

    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - nginx_exporter

  grafana:
    image: grafana/grafana:latest

    container_name: grafana_dashboard

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: