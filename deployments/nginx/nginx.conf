# nginx/nginx.conf
events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 valid=30s ipv6=off;
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    upstream mlops-nginx-exam-apis {

        server mlops-nginx-exam:8000;

        # Optional strategies
        # least_conn;
        # ip_hash;
    }

    map $http_x_experiment_group $api_backend {
        debug       mlops-nginx-exam-debug:8007;
        default     mlops-nginx-exam:8000;
    }
    #
    # HTTP -> HTTPS Redirect
    #
    server {
        listen 80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }

    #
    # HTTPS Reverse Proxy
    #
    server {

        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {

            limit_req zone=apilimit burst=5 nodelay;

            auth_basic "API Access Protected";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://$api_backend;
            #proxy_pass http://mlops-nginx-exam-apis;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    #
    # INTERNAL NGINX STATUS
    # Used ONLY by nginx_exporter
    #
    server {

        listen 8081;

        location /nginx_status {

            stub_status;

            access_log off;

            allow 172.19.0.0/16;
            allow 172.18.0.0/16;
            #deny all;
        }
    }
}